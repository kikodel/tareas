                const client = clients.find((c) => c.id === t.client);
                const dateInfo = formatDate(t.date);
                const statusInfo = statusMeta(t.status);
                const isDone = t.status === "completada";
                return (
                  <button
                    key={t.id}
                    onClick={() => onTaskClick(t)}
                    className="priority-card"
                    style={{
                      textAlign: "left", background: "white", border: `1px solid ${color}`, borderLeft: `4px solid ${color}`,
                      borderRadius: "10px", padding: isUrgent ? "14px 16px" : "11px 13px", opacity: isDone ? 0.5 : 1,
                      animationDelay: `${idx * 0.04}s`,
                    }}
                  >
                    <div style={{ fontSize: isUrgent ? "15px" : "13px", fontWeight: 600, color: "#1A1A2E", marginBottom: "6px", lineHeight: 1.3, textDecoration: isDone ? "line-through" : "none" }}>
                      {t.title}
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap" }}>
                      {client && <span style={{ fontSize: "11px", color: "#AAAAAA", fontFamily: "'Nunito', sans-serif" }}>{client.label}</span>}
                      <span style={{ fontSize: "10px", color: statusInfo.color, fontFamily: "'Nunito', sans-serif", fontWeight: 700 }}>{isDone ? "✓ Hecha" : statusInfo.label}</span>
                      {dateInfo && <span style={{ fontSize: "11px", color: dateInfo.overdue ? "#6C5CE7" : "#AAAAAA", fontFamily: "'Nunito', sans-serif" }}>{dateInfo.text}</span>}
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}


function App() {
  const [tasks, setTasks] = useState([]);
  const [clients, setClients] = useState(DEFAULT_CLIENTS);
  const [projects, setProjects] = useState(DEFAULT_PROJECTS);
  const [calendarOrder, setCalendarOrder] = useState({});
  const [events, setEvents] = useState([]);
  const [calendarSubView, setCalendarSubView] = useState("2semanas"); // "2semanas" | "semana" | "dia"
  const [selectedDay, setSelectedDay] = useState(() => new Date());
  const [editingEvent, setEditingEvent] = useState(null); // null | {} (nuevo) | event object (editar)
  const [showEventModal, setShowEventModal] = useState(false); // { "2026-07-10": ["id1","id2"] }
  const [loaded, setLoaded] = useState(false);
  const [viewMode, setViewMode] = useState("proyecto");
  const [activeFilter, setActiveFilter] = useState(null);
  const [showCompleted, setShowCompleted] = useState(false);
  const [showForm, setShowForm] = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);
  const [draft, setDraft] = useState({ title: "", client: "", priority: "media", date: "", notes: "" });
  const [editingTaskId, setEditingTaskId] = useState(null);
  const editingTask = editingTaskId ? tasks.find((t) => t.id === editingTaskId) || null : null;
  const [calWeekStart, setCalWeekStart] = useState(() => startOfWeek(new Date()));

  const [syncing, setSyncing] = useState(false);
  const [syncError, setSyncError] = useState(false);
  const removedIdsRef = React.useRef([]);

  useEffect(() => {
    (async () => {
      try {
        const res = await fetch("/api/tasks");
        const remote = await res.json();
        let current = remote.tasks || [];
        const storedVersion = remote.dataVersion || 0;
        removedIdsRef.current = remote.removedIds || [];

        // Migración: tareas guardadas con el modelo viejo (done: true/false)
        // pasan al modelo de 4 estados sin perder si ya estaban completadas.
        current = current.map((t) => {
          let migrated = t;
          if (!migrated.status) {
            migrated = { ...migrated, status: migrated.done ? "completada" : "pendiente", followUpDate: migrated.followUpDate || null };
          }
          // Subtareas viejas con done: boolean pasan a status completo (Pendiente/En curso/Seguimiento/Hecha).
          if ((migrated.subtasks || []).some((s) => !s.status)) {
            migrated = { ...migrated, subtasks: migrated.subtasks.map((s) => (s.status ? s : { ...s, status: s.done ? "completada" : "pendiente" })) };
          }
          return migrated;
        });

        if (storedVersion < 7) {
          // Corrección de datos: en una sesión anterior quedaron fechas puestas
          // por error en subtareas de "Colegio Javier" que no debían tenerlas.
          // Se limpian una sola vez al detectar versión vieja.
          current = current.map((t) => {
            if (t.id !== "colegio-javier-activacion-20260624") return t;
            return { ...t, subtasks: (t.subtasks || []).map((s) => ({ ...s, date: null })) };
          });
        }

        if (storedVersion < DATA_VERSION) {
          // Hay tareas nuevas o corregidas desde el chat: las mergeamos.
          // Si una tarea con el mismo id ya existe (el usuario pudo haberla tocado:
          // completarla, editarla, borrarla), respetamos lo que el usuario hizo
          // y solo sumamos las que son genuinamente nuevas.
          current = current.filter((t) => !DEPRECATED_IDS.includes(t.id));
          const existingIds = new Set(current.map((t) => t.id));
          const toAdd = CLAUDE_TASKS.filter((t) => !existingIds.has(t.id) && !removedIdsRef.current.includes(t.id));
          current = [...toAdd, ...current];
        }

        setTasks(current);
        setClients(remote.clients && remote.clients.length > 0 ? remote.clients : DEFAULT_CLIENTS);
        setProjects(remote.projects && remote.projects.length > 0 ? remote.projects : DEFAULT_PROJECTS);
        setCalendarOrder(remote.calendarOrder || {});
        setEvents(remote.events || []);
      } catch (e) {
        setSyncError(true);
        setTasks(CLAUDE_TASKS);
      }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    setSyncing(true);
    const save = async () => {
      try {
        const res = await fetch("/api/tasks", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tasks, clients, projects, calendarOrder, events, dataVersion: DATA_VERSION, removedIds: removedIdsRef.current }),
        });
        setSyncError(!res.ok);
      } catch (e) {
        setSyncError(true);
      }
      setSyncing(false);
    };
    const timeout = setTimeout(save, 500);
    return () => clearTimeout(timeout);
  }, [tasks, clients, projects, calendarOrder, events, loaded]);

  // Mueve una tarea (o actualiza su fecha) al arrastrarla a otro día
  const saveEvent = (ev) => {
    setEvents((prev) => {
      const exists = prev.find((e) => e.id === ev.id);
      return exists ? prev.map((e) => (e.id === ev.id ? ev : e)) : [...prev, ev];
    });
    setShowEventModal(false);
    setEditingEvent(null);
  };

  const deleteEvent = (id) => {
    setEvents((prev) => prev.filter((e) => e.id !== id));
    setShowEventModal(false);
    setEditingEvent(null);
  };

  const moveTaskToDay = (taskId, newDate) => {
    setTasks((prev) => prev.map((t) => (t.id === taskId ? { ...t, date: newDate } : t)));
    // Limpiar el orden manual del día anterior para este id, ya que cambió de día
    setCalendarOrder((prev) => {
      const updated = { ...prev };
      Object.keys(updated).forEach((d) => {
        updated[d] = updated[d].filter((id) => id !== taskId);
        if (updated[d].length === 0) delete updated[d];
      });
      return updated;
    });
  };

  // Reordena tareas dentro de un mismo día (drag & drop en la misma celda)
  const reorderInDay = (date, orderedIds) => {
    setCalendarOrder((prev) => ({ ...prev, [date]: orderedIds }));
  };

  const addProject = (label) => {
    const id = "proj_" + uid();
    setProjects((prev) => [...prev, { id, label }]);
  };

  const updateProject = (id, label) => {
    setProjects((prev) => prev.map((p) => (p.id === id ? { ...p, label } : p)));
  };

  const removeProject = (id) => {
    setProjects((prev) => prev.filter((p) => p.id !== id));
    // Los clientes que pertenecían a este proyecto quedan sin proyecto (no se borran).
    setClients((prev) => prev.map((c) => (c.project === id ? { ...c, project: null } : c)));
  };

  const addClient = (label, project) => {
    const id = "client_" + uid();
    setClients((prev) => [...prev, { id, label, project: project || null }]);
  };

  const updateClient = (id, updates) => {
    setClients((prev) => prev.map((c) => (c.id === id ? { ...c, ...updates } : c)));
  };

  const removeClient = (id) => {
    setClients((prev) => prev.filter((c) => c.id !== id));
    // Las tareas que tenían este cliente quedan sin cliente (no se borran).
    setTasks((prev) => prev.map((t) => (t.client === id ? { ...t, client: "personal" } : t)));
  };

  const addTask = () => {
    if (!draft.title.trim()) return;
    const t = {
      id: uid(),
      title: draft.title.trim(),
      client: draft.client || "personal",
      priority: draft.priority,
      date: draft.date || null,
      notes: draft.notes.trim(),
      status: "pendiente",
      followUpDate: null,
      subtasks: [],
      createdAt: Date.now(),
    };
    setTasks((prev) => [t, ...prev]);
    setDraft({ title: "", client: "", priority: "media", date: "", notes: "" });
    setShowForm(false);
  };

  const setStatus = (id, statusId) => {
    setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, status: statusId } : t)));
  };

  const setFollowUp = (id, date) => {
    setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, followUpDate: date } : t)));
  };

  const saveEdit = (id, updates) => {
    setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, ...updates } : t)));
    setEditingTaskId(null);
  };

  const addSubtask = (taskId, title) => {
    setTasks((prev) => prev.map((t) => {
      if (t.id !== taskId) return t;
      const subtasks = [...(t.subtasks || []), { id: uid(), title, status: "pendiente", date: null }];
      return { ...t, subtasks };
    }));
  };

  const setSubtaskStatus = (taskId, subtaskId, statusId) => {
    setTasks((prev) => prev.map((t) => {
      if (t.id !== taskId) return t;
      const subtasks = (t.subtasks || []).map((s) => (s.id === subtaskId ? { ...s, status: statusId } : s));
      return { ...t, subtasks };
    }));
  };

  const removeSubtask = (taskId, subtaskId) => {
    setTasks((prev) => prev.map((t) => {
      if (t.id !== taskId) return t;
      const subtasks = (t.subtasks || []).filter((s) => s.id !== subtaskId);
      return { ...t, subtasks };
    }));
  };

  const setSubtaskDate = (taskId, subtaskId, date) => {
    setTasks((prev) => prev.map((t) => {
      if (t.id !== taskId) return t;
      const subtasks = (t.subtasks || []).map((s) => (s.id === subtaskId ? { ...s, date: date || null } : s));
      return { ...t, subtasks };
    }));
  };

  const removeTask = (id) => {
    setTasks((prev) => prev.filter((t) => t.id !== id));
    if (!removedIdsRef.current.includes(id)) {
      removedIdsRef.current = [...removedIdsRef.current, id];
    }
  };

  const visibleTasks = useMemo(() => {
    let list = tasks.filter((t) => (showCompleted ? true : t.status !== "completada"));
    if (activeFilter && viewMode === "proyecto") {
      list = list.filter((t) => clients.find((c) => c.id === t.client)?.project === activeFilter);
    }
    return list.sort((a, b) => {
      const aDone = a.status === "completada", bDone = b.status === "completada";
      if (aDone !== bDone) return aDone ? 1 : -1;
      const pw = priorityMeta(b.priority).weight - priorityMeta(a.priority).weight;
      if (!a.date && !b.date) return pw || b.createdAt - a.createdAt;
      if (!a.date) return 1;
      if (!b.date) return -1;
      return a.date.localeCompare(b.date) || pw;
    });
  }, [tasks, activeFilter, viewMode, showCompleted]);

  const calendarTasks = useMemo(() => {
    return tasks.filter((t) => (showCompleted ? true : t.status !== "completada"));
  }, [tasks, showCompleted]);

  const counts = useMemo(() => {
    const open = tasks.filter((t) => t.status !== "completada");
    const urgentToday = open.filter((t) => t.date && formatDate(t.date)?.urgent);
    const followUpsDue = open.filter((t) => t.followUpDate && formatDate(t.followUpDate)?.urgent);
    return { open: open.length, urgent: urgentToday.length, followUps: followUpsDue.length };
  }, [tasks]);

  const filterOptions = viewMode === "proyecto" ? projects : [];

  // Tareas en seguimiento cuya fecha ya llegó o pasó
  const reviewDue = tasks.filter((t) =>
    t.status === "seguimiento" && t.followUpDate && new Date(t.followUpDate + "T00:00:00") <= new Date()
  );

  return (
    <TaxonomyContext.Provider value={{ clients, projects }}>
    <div style={{ background: "#F7F6F3", color: "#1A1A2E", minHeight: "100vh", maxWidth: viewMode === "fecha" ? "960px" : "660px", margin: "0 auto", transition: "max-width 0.2s ease" }}>

      {/* HEADER */}
      <div style={{ background: "white", borderBottom: "1px solid #F0EEEE", padding: "20px 24px 18px", display: "flex", justifyContent: "space-between", alignItems: "center", boxShadow: "0 1px 4px rgba(0,0,0,0.04)" }}>
        <div>
          <h1 style={{ fontSize: "24px", fontWeight: 800, color: "#1A1A2E", letterSpacing: "-0.5px", marginBottom: "2px" }}>
            Panel de tareas
          </h1>
          <div style={{ fontSize: "13px", color: "#AAAAAA", display: "flex", gap: "8px", alignItems: "center" }}>
            <span>{counts.open} abiertas</span>
            {counts.urgent > 0 && <><span>·</span><span style={{ color: "#D63031" }}>{counts.urgent} con fecha próxima</span></>}
            {reviewDue.length > 0 && <><span>·</span><span style={{ color: "#C59400" }}>{reviewDue.length} a revisar</span></>}
            {!syncError && syncing && <><span>·</span><span style={{ color: "#BBBBBB" }}>guardando...</span></>}
            {!syncError && !syncing && loaded && <><span>·</span><span style={{ color: "#00A878" }}>✓ sincronizado</span></>}
            {syncError && <><span>·</span><span style={{ color: "#D63031" }}>sin conexión</span></>}
          </div>
        </div>
        <div style={{ display: "flex", gap: "8px" }}>
          <button onClick={() => setShowAdmin(true)} title="Administrar clientes y proyectos"
            style={{ background: "#F5F5F5", color: "#888", border: "none", borderRadius: "12px", padding: "10px 14px", fontSize: "15px" }}>
            ⚙
          </button>
          <button onClick={() => setShowForm(true)}
            style={{ background: "#6C5CE7", color: "white", border: "none", borderRadius: "12px", padding: "10px 18px", fontWeight: 700, fontSize: "13px", boxShadow: "0 2px 8px rgba(108,92,231,0.3)" }}>
            + Nueva tarea
          </button>
        </div>
      </div>

      {/* BANNER DE REVISIÓN — aparece cuando llega la fecha de seguimiento */}
      {reviewDue.map((t) => (
        <div key={t.id} className="review-banner" style={{ margin: "16px 24px 0", background: "linear-gradient(135deg, #FFFDE7 0%, #FFF8E1 100%)", border: "1.5px solid #FFD93D", borderRadius: "16px", padding: "14px 16px", display: "flex", alignItems: "flex-start", gap: "12px" }}>
          <span style={{ fontSize: "22px", flexShrink: 0, marginTop: "1px" }}>📋</span>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: "13px", fontWeight: 700, color: "#8B6914", marginBottom: "3px" }}>
              Revisión pendiente: {t.title}
            </div>
            <div style={{ fontSize: "12px", color: "#A07C1C", marginBottom: "10px" }}>
              {t.notes ? t.notes : "¿El cambio aplicado tuvo efecto? Revisá y decidí el próximo paso."}
            </div>
            <div style={{ display: "flex", gap: "8px", flexWrap: "wrap" }}>
              <button
                onClick={() => { setStatus(t.id, "completada"); }}
                style={{ background: "#00A878", color: "white", border: "none", borderRadius: "10px", padding: "7px 14px", fontSize: "12px", fontWeight: 700 }}>
                ✓ Funcionó, cerrar
              </button>
              <button
                onClick={() => setEditingTaskId(t.id)}
                style={{ background: "white", color: "#888", border: "1.5px solid #DDD", borderRadius: "10px", padding: "7px 14px", fontSize: "12px", fontWeight: 500 }}>
                ↻ Reprogramar seguimiento
              </button>
              <button
                onClick={() => setEditingTaskId(t.id)}
                style={{ background: "white", color: "#5B7FE8", border: "1.5px solid #C7D4FF", borderRadius: "10px", padding: "7px 14px", fontSize: "12px", fontWeight: 500 }}>
                Ver tarea completa
              </button>
            </div>
          </div>
        </div>
      ))}

      {/* TABS DE VISTA */}
      <div style={{ display: "flex", gap: "0", padding: "20px 24px 0" }}>
        <div style={{ display: "flex", background: "#EFEFEF", borderRadius: "12px", padding: "4px", gap: "2px" }}>
          {VIEW_MODES.map((v) => (
            <button key={v.id} onClick={() => { setViewMode(v.id); setActiveFilter(null); }}
              style={{ background: viewMode === v.id ? "white" : "transparent", color: viewMode === v.id ? "#1A1A2E" : "#AAAAAA", border: "none", padding: "7px 16px", fontSize: "13px", fontWeight: viewMode === v.id ? 700 : 500, borderRadius: "9px", boxShadow: viewMode === v.id ? "0 1px 4px rgba(0,0,0,0.08)" : "none", transition: "all 0.15s ease" }}>
              {v.label}
            </button>
          ))}
        </div>
      </div>

      {/* FILTROS */}
      {viewMode === "proyecto" && (
        <div className="tm-scroll" style={{ display: "flex", gap: "7px", padding: "14px 24px", overflowX: "auto" }}>
          <button className={`chip ${activeFilter === null ? "active" : ""}`} onClick={() => setActiveFilter(null)}>Todas</button>
          {filterOptions.map((opt) => (
            <button key={opt.id} className={`chip ${activeFilter === opt.id ? "active" : ""}`} onClick={() => setActiveFilter(opt.id)}>{opt.label}</button>
          ))}
        </div>
      )}

      {!loaded && (
        <div style={{ textAlign: "center", padding: "50px 20px", color: "#AAAAAA" }}>
          <div style={{ fontSize: "13px" }}>Cargando tus tareas...</div>
        </div>
      )}

      {loaded && tasks.length === 0 && (
        <div style={{ textAlign: "center", padding: "50px 20px", color: "#AAAAAA", border: "1px dashed #2A323D", borderRadius: "12px", margin: "18px 20px" }}>
          <div style={{ fontFamily: "'Nunito', sans-serif", fontSize: "15px", color: "#1A1A2E", marginBottom: "4px" }}>Sin tareas acá</div>
          <div style={{ fontSize: "13px" }}>Tocá "Nueva tarea" para agregar la primera.</div>
        </div>
      )}

      {loaded && viewMode === "fecha" && (
        <div>
          {/* Sub-vista toggle + botón nuevo evento */}
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 20px 0" }}>
            <div className="date-view-toggle">
              {["2semanas","semana","dia"].map((v) => (
                <button key={v} className={`date-view-btn${calendarSubView === v ? " active" : ""}`} onClick={() => setCalendarSubView(v)}>
                  {v === "2semanas" ? "2 semanas" : v === "semana" ? "Semana" : "Día"}
                </button>
              ))}
            </div>
            <button
              onClick={() => { setEditingEvent({}); setShowEventModal(true); }}
              style={{ background: "#F3F0FF", color: "#6C5CE7", border: "1.5px solid #C7BFFF", borderRadius: "10px", padding: "7px 14px", fontSize: "12px", fontWeight: 700 }}>
              + Evento
            </button>
          </div>

          {calendarSubView === "2semanas" && (
            <TwoWeekCalendar
              tasks={calendarTasks}
              events={events}
              onTaskClick={(t) => setEditingTaskId(t.id)}
              onEventClick={(ev) => { setEditingEvent(ev); setShowEventModal(true); }}
              weekStart={calWeekStart}
              onPrevWeeks={() => setCalWeekStart((d) => { const n = new Date(d); n.setDate(n.getDate() - 14); return n; })}
              onNextWeeks={() => setCalWeekStart((d) => { const n = new Date(d); n.setDate(n.getDate() + 14); return n; })}
              onToday={() => setCalWeekStart(startOfWeek(new Date()))}
              calendarOrder={calendarOrder}
              onMoveTask={moveTaskToDay}
              onReorderInDay={reorderInDay}
            />
          )}

          {calendarSubView === "semana" && (
            <WeekTimeGrid
              weekStart={calWeekStart}
              tasks={calendarTasks}
              events={events}
              onTaskClick={(t) => setEditingTaskId(t.id)}
              onEventClick={(ev) => { setEditingEvent(ev); setShowEventModal(true); }}
              onPrev={() => setCalWeekStart((d) => { const n = new Date(d); n.setDate(n.getDate() - 7); return n; })}
              onNext={() => setCalWeekStart((d) => { const n = new Date(d); n.setDate(n.getDate() + 7); return n; })}
              onToday={() => setCalWeekStart(startOfWeek(new Date()))}
            />
          )}

          {calendarSubView === "dia" && (
            <DayTimeGrid
              selectedDate={selectedDay}
              setSelectedDate={setSelectedDay}
              tasks={calendarTasks}
              events={events}
              onTaskClick={(t) => setEditingTaskId(t.id)}
              onEventClick={(ev) => { setEditingEvent(ev); setShowEventModal(true); }}
            />
          )}
        </div>
      )}

      {loaded && tasks.length > 0 && viewMode === "proyecto" && (
        <KanbanBoard tasks={visibleTasks} onTaskClick={(t) => setEditingTaskId(t.id)} onSetSubtaskStatus={setSubtaskStatus} />
      )}

      {loaded && tasks.length > 0 && viewMode === "prioridad" && (
        <PriorityView tasks={visibleTasks} onTaskClick={(t) => setEditingTaskId(t.id)} />
      )}

      <div style={{ padding: "0 20px 28px" }}>
        {tasks.some((t) => t.status === "completada") && (
          <button onClick={() => setShowCompleted((s) => !s)} style={{ background: "transparent", border: "none", color: "#AAAAAA", fontSize: "12px", marginTop: "8px", textDecoration: "underline" }}>
            {showCompleted ? "Ocultar completadas" : "Ver completadas"}
          </button>
        )}
      </div>

      {showForm && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(26,26,46,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: "16px" }} onClick={() => setShowForm(false)}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: "white", border: "1px solid #EEEEEE", borderRadius: "16px", width: "100%", maxWidth: "440px", padding: "20px", maxHeight: "85vh", overflowY: "auto" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px" }}>
              <span style={{ fontFamily: "'Nunito', sans-serif", fontWeight: 700, fontSize: "16px" }}>Nueva tarea</span>
              <button onClick={() => setShowForm(false)} style={{ background: "none", border: "none", color: "#AAAAAA", fontSize: "18px" }}>✕</button>
            </div>

            <input autoFocus placeholder="¿Qué hay que hacer?" value={draft.title} onChange={(e) => setDraft({ ...draft, title: e.target.value })}
              style={{ width: "100%", background: "#F8F8F8", border: "1.5px solid #EEEEEE", borderRadius: "10px", padding: "11px 12px", color: "#1A1A2E", fontSize: "14px", marginBottom: "12px", outline: "none" }} />

            <div style={{ marginBottom: "12px" }}>
              <div style={{ fontSize: "11px", color: "#AAAAAA", marginBottom: "6px", fontFamily: "'Nunito', sans-serif" }}>CLIENTE</div>
              <select value={draft.client} onChange={(e) => setDraft({ ...draft, client: e.target.value })}
                style={{ width: "100%", background: "#F8F8F8", border: "1.5px solid #EEEEEE", borderRadius: "10px", padding: "10px 12px", color: "#1A1A2E", fontSize: "13px", outline: "none" }}>
                <option value="">Sin cliente / personal</option>
                {projects.map((p) => (
                  <optgroup key={p.id} label={p.label}>
                    {clients.filter((c) => c.project === p.id).map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
                  </optgroup>
                ))}
              </select>
            </div>

            <div style={{ display: "flex", gap: "10px", marginBottom: "12px" }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: "11px", color: "#AAAAAA", marginBottom: "6px", fontFamily: "'Nunito', sans-serif" }}>PRIORIDAD</div>
                <select value={draft.priority} onChange={(e) => setDraft({ ...draft, priority: e.target.value })}
                  style={{ width: "100%", background: "#F8F8F8", border: "1.5px solid #EEEEEE", borderRadius: "10px", padding: "10px 12px", color: "#1A1A2E", fontSize: "13px", outline: "none" }}>
                  {PRIORITIES.map((p) => <option key={p.id} value={p.id}>{p.label}</option>)}
                </select>
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: "11px", color: "#AAAAAA", marginBottom: "6px", fontFamily: "'Nunito', sans-serif" }}>FECHA</div>
                <input type="date" value={draft.date} onChange={(e) => setDraft({ ...draft, date: e.target.value })}
                  style={{ width: "100%", background: "#F8F8F8", border: "1.5px solid #EEEEEE", borderRadius: "10px", padding: "9px 10px", color: "#1A1A2E", fontSize: "13px", outline: "none" }} />
              </div>
            </div>

            <textarea placeholder="Notas (opcional)" value={draft.notes} onChange={(e) => setDraft({ ...draft, notes: e.target.value })} rows={2}
              style={{ width: "100%", background: "#F8F8F8", border: "1.5px solid #EEEEEE", borderRadius: "10px", padding: "10px 12px", color: "#1A1A2E", fontSize: "13px", outline: "none", resize: "none", marginBottom: "16px" }} />

            <button onClick={addTask} disabled={!draft.title.trim()}
              style={{ width: "100%", background: draft.title.trim() ? "#6C5CE7" : "#EEEEEE", color: draft.title.trim() ? "white" : "#AAAAAA", border: "none", borderRadius: "9px", padding: "13px", fontWeight: 700, fontSize: "14px", fontFamily: "'Nunito', sans-serif" }}>
              Agregar tarea
            </button>
          </div>
        </div>
      )}

      {editingTask && (
        <EditModal task={editingTask} onSave={saveEdit} onClose={() => setEditingTaskId(null)} onSetStatus={setStatus} onSetFollowUp={setFollowUp} onSetSubtaskStatus={setSubtaskStatus} onAddSubtask={addSubtask} onRemoveSubtask={removeSubtask} onSetSubtaskDate={setSubtaskDate} onDelete={(id) => { removeTask(id); setEditingTaskId(null); }} />
      )}

      {showAdmin && (
        <AdminModal
          clients={clients}
          projects={projects}
          onClose={() => setShowAdmin(false)}
          onAddProject={addProject}
          onUpdateProject={updateProject}
          onRemoveProject={removeProject}
          onAddClient={addClient}
          onUpdateClient={updateClient}
          onRemoveClient={removeClient}
        />
      )}

      {showEventModal && (
        <EventModal
          event={editingEvent && editingEvent.id ? editingEvent : null}
          onSave={saveEvent}
          onClose={() => { setShowEventModal(false); setEditingEvent(null); }}
          onDelete={deleteEvent}
        />
      )}
    </div>
    </TaxonomyContext.Provider>
  );
}

function AdminModal({ clients, projects, onClose, onAddProject, onUpdateProject, onRemoveProject, onAddClient, onUpdateClient, onRemoveClient }) {
  const [newProjectLabel, setNewProjectLabel] = React.useState("");
  const [newClientLabel, setNewClientLabel] = React.useState("");
  const [newClientProject, setNewClientProject] = React.useState("");
  const [editingProjectId, setEditingProjectId] = React.useState(null);
  const [editingClientId, setEditingClientId] = React.useState(null);
  const [editDraft, setEditDraft] = React.useState("");

  const submitProject = () => {
    if (!newProjectLabel.trim()) return;
    onAddProject(newProjectLabel.trim());
    setNewProjectLabel("");
  };

  const submitClient = () => {
    if (!newClientLabel.trim()) return;
    onAddClient(newClientLabel.trim(), newClientProject || null);
    setNewClientLabel("");
  };

  const startEditProject = (p) => { setEditingProjectId(p.id); setEditDraft(p.label); };
  const startEditClient = (c) => { setEditingClientId(c.id); setEditDraft(c.label); };

  const confirmEditProject = () => {
    if (editDraft.trim()) onUpdateProject(editingProjectId, editDraft.trim());
    setEditingProjectId(null);
  };
  const confirmEditClient = () => {
    if (editDraft.trim()) onUpdateClient(editingClientId, { label: editDraft.trim() });
    setEditingClientId(null);
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(26,26,46,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: "16px" }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: "white", border: "1px solid #EEEEEE", borderRadius: "16px", width: "100%", maxWidth: "480px", maxHeight: "88vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "20px 20px 14px", borderBottom: "1px solid #F0EEEE" }}>
          <span style={{ fontFamily: "'Nunito', sans-serif", fontWeight: 700, fontSize: "16px" }}>Administrar clientes y proyectos</span>
          <button onClick={onClose} style={{ background: "none", border: "none", color: "#AAAAAA", fontSize: "20px" }}>✕</button>
        </div>

        {/* Proyectos */}
        <div style={{ padding: "16px 20px", borderBottom: "1px solid #F0EEEE" }}>
          <div style={{ fontSize: "11px", color: "#AAAAAA", marginBottom: "10px", fontFamily: "'Nunito', sans-serif", letterSpacing: "0" }}>PROYECTOS</div>
          <div style={{ display: "flex", flexDirection: "column", gap: "6px", marginBottom: "10px" }}>
            {projects.map((p) => (
              <div key={p.id} style={{ display: "flex", alignItems: "center", gap: "8px", background: "#FAFAFA", border: "1px solid #F0EEEE", borderRadius: "10px", padding: "10px 12px" }}>
                {editingProjectId === p.id ? (
                  <input
                    autoFocus
                    value={editDraft}
                    onChange={(e) => setEditDraft(e.target.value)}
                    onKeyDown={(e) => { if (e.key === "Enter") confirmEditProject(); if (e.key === "Escape") setEditingProjectId(null); }}
                    onBlur={confirmEditProject}
                    style={{ flex: 1, background: "#F8F8F8", border: "1.5px solid #EEEEEE", borderRadius: "8px", padding: "5px 8px", color: "#1A1A2E", fontSize: "13px", outline: "none" }}
                  />
                ) : (
                  <span onClick={() => startEditProject(p)} style={{ flex: 1, fontSize: "13px", color: "#1A1A2E", cursor: "pointer" }}>{p.label}</span>
                )}
                <button onClick={() => startEditProject(p)} title="Editar" style={{ background: "none", border: "none", color: "#AAAAAA", fontSize: "13px" }}>✎</button>
                <button onClick={() => onRemoveProject(p.id)} title="Eliminar" style={{ background: "none", border: "none", color: "#AAAAAA", fontSize: "13px" }}>✕</button>
              </div>
            ))}
          </div>
          <div style={{ display: "flex", gap: "6px" }}>
            <input
              value={newProjectLabel}
              onChange={(e) => setNewProjectLabel(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") submitProject(); }}
              placeholder="+ nuevo proyecto"
              style={{ flex: 1, background: "#FAFAFA", border: "1px solid #F0EEEE", borderRadius: "10px", padding: "10px 12px", color: "#1A1A2E", fontSize: "13px", outline: "none" }}
            />
            <button onClick={submitProject} style={{ background: "#6C5CE7", color: "white", border: "none", borderRadius: "8px", padding: "8px 14px", fontSize: "13px", fontWeight: 700 }}>+</button>
          </div>
        </div>

        {/* Clientes */}
        <div style={{ padding: "16px 20px" }}>
          <div style={{ fontSize: "11px", color: "#AAAAAA", marginBottom: "10px", fontFamily: "'Nunito', sans-serif", letterSpacing: "0" }}>CLIENTES</div>
          <div style={{ display: "flex", flexDirection: "column", gap: "6px", marginBottom: "10px", maxHeight: "260px", overflowY: "auto" }}>
            {clients.map((c) => {
              const proj = projects.find((p) => p.id === c.project);
              return (
                <div key={c.id} style={{ display: "flex", alignItems: "center", gap: "8px", background: "#FAFAFA", border: "1px solid #F0EEEE", borderRadius: "10px", padding: "10px 12px" }}>
                  {editingClientId === c.id ? (
                    <input
                      autoFocus
                      value={editDraft}
                      onChange={(e) => setEditDraft(e.target.value)}
                      onKeyDown={(e) => { if (e.key === "Enter") confirmEditClient(); if (e.key === "Escape") setEditingClientId(null); }}
                      onBlur={confirmEditClient}
                      style={{ flex: 1, background: "#F8F8F8", border: "1.5px solid #EEEEEE", borderRadius: "8px", padding: "5px 8px", color: "#1A1A2E", fontSize: "13px", outline: "none" }}
                    />
                  ) : (
                    <div style={{ flex: 1, cursor: "pointer" }} onClick={() => startEditClient(c)}>
                      <div style={{ fontSize: "13px", color: "#1A1A2E" }}>{c.label}</div>
                      {proj && <div style={{ fontSize: "10px", color: "#AAAAAA", fontFamily: "'Nunito', sans-serif" }}>{proj.label}</div>}
                    </div>
                  )}
                  <select
                    value={c.project || ""}
                    onChange={(e) => onUpdateClient(c.id, { project: e.target.value || null })}
                    title="Cambiar proyecto"
                    style={{ background: "#F7F6F3", border: "1px solid #F0EEEE", borderRadius: "6px", padding: "4px 6px", color: "#AAAAAA", fontSize: "11px", outline: "none" }}
                  >
                    <option value="">Sin proyecto</option>
                    {projects.map((p) => <option key={p.id} value={p.id}>{p.label}</option>)}
                  </select>
                  <button onClick={() => onRemoveClient(c.id)} title="Eliminar" style={{ background: "none", border: "none", color: "#AAAAAA", fontSize: "13px" }}>✕</button>
                </div>
              );
            })}
          </div>
          <div style={{ display: "flex", gap: "6px" }}>
            <input
              value={newClientLabel}
              onChange={(e) => setNewClientLabel(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") submitClient(); }}
              placeholder="+ nuevo cliente"
              style={{ flex: 1, background: "#FAFAFA", border: "1px solid #F0EEEE", borderRadius: "10px", padding: "10px 12px", color: "#1A1A2E", fontSize: "13px", outline: "none" }}
            />
            <select
              value={newClientProject}
              onChange={(e) => setNewClientProject(e.target.value)}
              style={{ background: "#F7F6F3", border: "1px solid #F0EEEE", borderRadius: "8px", padding: "8px 8px", color: "#1A1A2E", fontSize: "12px", outline: "none" }}
            >
              <option value="">Sin proyecto</option>
              {projects.map((p) => <option key={p.id} value={p.id}>{p.label}</option>)}
            </select>
            <button onClick={submitClient} style={{ background: "#6C5CE7", color: "white", border: "none", borderRadius: "8px", padding: "8px 14px", fontSize: "13px", fontWeight: 700 }}>+</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function EditModal({ task, onSave, onClose, onSetStatus, onSetFollowUp, onSetSubtaskStatus, onAddSubtask, onRemoveSubtask, onSetSubtaskDate, onDelete }) {
  const { clients, projects } = useTaxonomy();
  const [form, setForm] = React.useState({
    title: task.title,
    client: task.client === "personal" ? "" : task.client,
    priority: task.priority,
    date: task.date || "",
    notes: task.notes || "",
  });
  const [pendingFollowUp, setPendingFollowUp] = React.useState(false);
  const client = clients.find((c) => c.id === task.client);
  const priorityColor = { urgente: "#D63031", alta: "#E17055", media: "#2D88C8", baja: "#AAAAAA" }[form.priority];

  const handleSave = () => {
    if (!form.title.trim()) return;
    onSave(task.id, {
      title: form.title.trim(),
      client: form.client || "personal",
      priority: form.priority,
      date: form.date || null,
      notes: form.notes.trim(),
    });
  };

  const handleTabClick = (statusId) => {
    if (statusId === "seguimiento") {
      setPendingFollowUp(true);
      return;
    }
    onSetStatus(task.id, statusId);
  };

  const confirmFollowUp = (date) => {
    if (!date) return;
    onSetFollowUp(task.id, date);
    onSetStatus(task.id, "seguimiento");
    setPendingFollowUp(false);
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(26,26,46,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: "16px" }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: "white", border: `1px solid ${priorityColor}`, borderRadius: "16px", width: "100%", maxWidth: "480px", maxHeight: "88vh", overflowY: "auto" }}>
        {/* Header con título editable inline */}
        <div style={{ padding: "20px 20px 14px", borderBottom: "1px solid #F0EEEE" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: "10px", marginBottom: "10px" }}>
            <input
              value={form.title}
              onChange={(e) => setForm({ ...form, title: e.target.value })}
              style={{ flex: 1, background: "transparent", border: "none", color: "#1A1A2E", fontSize: "18px", fontWeight: 700, fontFamily: "'Nunito', sans-serif", outline: "none", padding: "2px 0" }}
            />
            <button onClick={onClose} style={{ background: "none", border: "none", color: "#AAAAAA", fontSize: "20px", flexShrink: 0 }}>✕</button>
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: "10px", flexWrap: "wrap" }}>
            {client && <span style={{ fontSize: "12px", color: "#AAAAAA", fontFamily: "'Nunito', sans-serif" }}>{client.label}</span>}
            <span style={{ fontSize: "11px", fontWeight: 700, color: priorityColor, textTransform: "uppercase", letterSpacing: "0", fontFamily: "'Nunito', sans-serif" }}>{priorityMeta(form.priority).label}</span>
            {form.date && (
              <span style={{ fontSize: "12px", color: "#AAAAAA", fontFamily: "'Nunito', sans-serif" }}>{formatDate(form.date)?.text}</span>
            )}
          </div>
        </div>

        {/* Estado */}
        <div style={{ padding: "16px 20px", borderBottom: "1px solid #F0EEEE" }}>
          <div style={{ fontSize: "11px", color: "#AAAAAA", marginBottom: "8px", fontFamily: "'Nunito', sans-serif", letterSpacing: "0" }}>ESTADO</div>
          <div style={{ display: "flex", gap: "4px", flexWrap: "wrap" }}>
            {STATUSES.map((s) => {
              const active = task.status === s.id;
              return (
                <button
                  key={s.id}
                  onClick={() => handleTabClick(s.id)}
                  className={`status-pill${active ? ` sp-${s.id}` : ""}`}
                >
                  {s.id === "completada" ? "✓ Hecha" : s.label}
                </button>
              );
            })}
          </div>
          {task.status === "seguimiento" && task.followUpDate && !pendingFollowUp && (
            <button
              onClick={() => setPendingFollowUp(true)}
              style={{ marginTop: "8px", background: "none", border: "none", color: "#F59E0B", fontSize: "12px", textDecoration: "underline", fontFamily: "'Nunito', sans-serif" }}
            >
              ↻ seguir {formatDate(task.followUpDate)?.text} — cambiar fecha
            </button>
          )}
          {pendingFollowUp && (
            <div style={{ marginTop: "10px", padding: "10px", background: "#F7F6F3", border: "1px solid #F0EEEE", borderRadius: "8px" }}>
              <div style={{ fontSize: "10px", color: "#F59E0B", marginBottom: "6px", fontFamily: "'Nunito', sans-serif" }}>¿CUÁNDO QUERÉS RETOMARLA?</div>
              <div style={{ display: "flex", gap: "8px", alignItems: "center" }}>
                <input
                  type="date"
                  ref={(el) => { if (el) { el.focus(); try { el.showPicker(); } catch (e) {} } }}
                  min={new Date().toISOString().slice(0, 10)}
                  defaultValue={task.followUpDate || ""}
                  onChange={(e) => confirmFollowUp(e.target.value)}
                  style={{ background: "#F8F8F8", border: "1.5px solid #EEEEEE", borderRadius: "8px", padding: "6px 8px", color: "#1A1A2E", fontSize: "13px", outline: "none" }}
                />
                <button onClick={() => setPendingFollowUp(false)} style={{ background: "none", border: "none", color: "#AAAAAA", fontSize: "12px", textDecoration: "underline" }}>cancelar</button>
              </div>
            </div>
          )}
        </div>

        {/* Detalles: cliente, prioridad, fecha */}
        <div style={{ padding: "16px 20px", borderBottom: "1px solid #F0EEEE" }}>
          <div style={{ display: "flex", gap: "10px", marginBottom: "10px" }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: "11px", color: "#AAAAAA", marginBottom: "6px", fontFamily: "'Nunito', sans-serif" }}>CLIENTE</div>
              <select value={form.client} onChange={(e) => setForm({ ...form, client: e.target.value })}
                style={{ width: "100%", background: "#F8F8F8", border: "1.5px solid #EEEEEE", borderRadius: "10px", padding: "9px 10px", color: "#1A1A2E", fontSize: "13px", outline: "none" }}>
                <option value="">Sin cliente / personal</option>
                {projects.map((p) => (
                  <optgroup key={p.id} label={p.label}>
                    {clients.filter((c) => c.project === p.id).map((c) => <option key={c.id} value={c.id}>{c.label}</option>)}
                  </optgroup>
                ))}
              </select>
            </div>
          </div>

          <div style={{ display: "flex", gap: "10px" }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: "11px", color: "#AAAAAA", marginBottom: "6px", fontFamily: "'Nunito', sans-serif" }}>PRIORIDAD</div>
              <select value={form.priority} onChange={(e) => setForm({ ...form, priority: e.target.value })}
                style={{ width: "100%", background: "#F8F8F8", border: "1.5px solid #EEEEEE", borderRadius: "10px", padding: "9px 10px", color: "#1A1A2E", fontSize: "13px", outline: "none" }}>
                {PRIORITIES.map((p) => <option key={p.id} value={p.id}>{p.label}</option>)}
              </select>
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: "11px", color: "#AAAAAA", marginBottom: "6px", fontFamily: "'Nunito', sans-serif" }}>FECHA</div>
              <input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })}
                style={{ width: "100%", background: "#F8F8F8", border: "1.5px solid #EEEEEE", borderRadius: "10px", padding: "8px 9px", color: "#1A1A2E", fontSize: "13px", outline: "none" }} />
            </div>
          </div>
        </div>

        {/* Notas */}
        <div style={{ padding: "16px 20px", borderBottom: "1px solid #F0EEEE" }}>
          <div style={{ fontSize: "11px", color: "#AAAAAA", marginBottom: "6px", fontFamily: "'Nunito', sans-serif" }}>NOTAS</div>
          <textarea value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} rows={2} placeholder="Sin notas todavía..."
            style={{ width: "100%", background: "#F8F8F8", border: "1.5px solid #EEEEEE", borderRadius: "10px", padding: "10px 12px", color: "#1A1A2E", fontSize: "13px", outline: "none", resize: "none" }} />
        </div>

        {/* Subtareas */}
        <div style={{ padding: "16px 20px", borderBottom: "1px solid #F0EEEE" }}>
          <SubtaskChecklist task={task} onSetStatus={onSetSubtaskStatus} onAdd={onAddSubtask} onRemove={onRemoveSubtask} onSetDate={onSetSubtaskDate} />
        </div>

        {/* Acciones */}
        <div style={{ padding: "16px 20px" }}>
          <button onClick={handleSave} disabled={!form.title.trim()}
            style={{ width: "100%", background: form.title.trim() ? "#6C5CE7" : "#EEEEEE", color: form.title.trim() ? "white" : "#AAAAAA", border: "none", borderRadius: "9px", padding: "13px", fontWeight: 700, fontSize: "14px", fontFamily: "'Nunito', sans-serif", marginBottom: "8px" }}>
            Guardar cambios
          </button>
          <button onClick={() => onDelete(task.id)}
            style={{ width: "100%", background: "#FFF5F5", color: "#D63031", border: "1.5px solid #FFCACA", borderRadius: "9px", padding: "10px", fontSize: "13px" }}>
            Eliminar tarea
          </button>
        </div>
      </div>
    </div>
  );
}

function SubtaskChecklist({ task, onSetStatus, onAdd, onRemove, onSetDate }) {
  const [newSubtask, setNewSubtask] = React.useState("");
  const [datePickerFor, setDatePickerFor] = React.useState(null);
  const subtasks = task.subtasks || [];
  const done = subtasks.filter((s) => s.status === "completada").length;

  const submit = () => {
    if (!newSubtask.trim()) return;
    onAdd(task.id, newSubtask.trim());
    setNewSubtask("");
  };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "10px" }}>
        <div style={{ fontSize: "11px", color: "#AAAAAA", fontFamily: "'Nunito', sans-serif", letterSpacing: "0" }}>SUBTAREAS</div>
        {subtasks.length > 0 && (
          <div style={{ fontSize: "11px", color: "#AAAAAA", fontFamily: "'Nunito', sans-serif" }}>{done}/{subtasks.length}</div>
        )}
      </div>

      {subtasks.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: "8px", marginBottom: "12px" }}>
          {subtasks.map((s) => {
            const dateInfo = formatDate(s.date);
            const sStatus = statusMeta(s.status);
            const isDone = s.status === "completada";
            return (
              <div key={s.id} style={{ background: "#FAFAFA", border: "1px solid #F0EEEE", borderRadius: "10px", padding: "10px 12px" }}>
                <div style={{ display: "flex", alignItems: "flex-start", gap: "8px", marginBottom: "8px" }}>
                  <span style={{ fontSize: "13px", color: isDone ? "#AAAAAA" : "#1A1A2E", textDecoration: isDone ? "line-through" : "none", flex: 1, lineHeight: 1.3 }}>
                    {s.title}
                  </span>
                  <button
                    onClick={() => setDatePickerFor(datePickerFor === s.id ? null : s.id)}
                    title="Fecha de la subtarea"
                    style={{ background: "none", border: "none", color: dateInfo ? "#F59E0B" : "#AAAAAA", fontSize: "13px", padding: "2px", flexShrink: 0 }}
                  >
                    📅
                  </button>
                  <button onClick={() => onRemove(task.id, s.id)} style={{ background: "none", border: "none", color: "#AAAAAA", fontSize: "12px", padding: "2px", flexShrink: 0 }}>✕</button>
                </div>

                <div style={{ display: "flex", gap: "3px", flexWrap: "wrap" }}>
                  {STATUSES.map((st) => {
                    const active = s.status === st.id;
                    return (
                      <button
                        key={st.id}
                        onClick={() => onSetStatus(task.id, s.id, st.id)}
                        className={`status-pill${active ? ` sp-${st.id}` : ""}`}
                        style={{ fontSize: "10px" }}
                      >
                        {st.id === "completada" ? "✓ Hecha" : st.label}
                      </button>
                    );
                  })}
                </div>

                {dateInfo && datePickerFor !== s.id && (
                  <div style={{ fontSize: "11px", color: dateInfo.overdue ? "#D63031" : "#C59400", marginTop: "7px", fontWeight: 500 }}>
                    {dateInfo.text}{dateInfo.overdue ? " ⚠" : ""}
                  </div>
                )}
                {datePickerFor === s.id && (
                  <div style={{ display: "flex", gap: "6px", alignItems: "center", marginTop: "7px" }}>
                    <input
                      type="date"
                      ref={(el) => { if (el) { el.focus(); try { el.showPicker(); } catch (e) {} } }}
                      defaultValue={s.date || ""}
                      onChange={(e) => { onSetDate(task.id, s.id, e.target.value); setDatePickerFor(null); }}
                      style={{ background: "#F8F8F8", border: "1.5px solid #EEEEEE", borderRadius: "8px", padding: "5px 8px", color: "#1A1A2E", fontSize: "12px", outline: "none" }}
                    />
                    {s.date && (
                      <button onClick={() => { onSetDate(task.id, s.id, null); setDatePickerFor(null); }} style={{ background: "none", border: "none", color: "#AAAAAA", fontSize: "11px", textDecoration: "underline" }}>
                        quitar
                      </button>
                    )}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
      <input
        type="text"
        value={newSubtask}
        onChange={(e) => setNewSubtask(e.target.value)}
        onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
        placeholder="+ subtarea"
        style={{ width: "100%", background: "#F7F6F3", border: "1px solid #F0EEEE", borderRadius: "8px", padding: "9px 11px", color: "#1A1A2E", fontSize: "13px", outline: "none" }}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
